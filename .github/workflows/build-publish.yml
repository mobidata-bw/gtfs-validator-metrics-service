name: build & publish Docker image

on:
  push:
    tags:
      - '*'

jobs:
  lint-test:
    name: lint & test
    uses: './.github/workflows/lint-test.yml'

  build-publish:
    name: build & publish Docker image
    needs:
      - lint-test
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v7

    - name: set up QEMU for cross-platform Docker builds
      uses: docker/setup-qemu-action@v4
    - name: set up Docker buildx
      uses: docker/setup-buildx-action@v4
    - name: install tools
      run: |
        sudo apt install -y jq

    - name: log into the GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: compute Docker image OCI metadata from commit & repo
      id: docker-metadata
      uses: docker/metadata-action@v5
      with:
        labels: |
          org.opencontainers.image.version=${{ github.ref_name }}

    - name: build and push Docker image
      uses: docker/build-push-action@v6
      with:
        push: true
        tags: |
          ghcr.io/${{ github.repository }}:latest
          ghcr.io/${{ github.repository }}:${{ github.ref_name }}
        labels: ${{ steps.docker-metadata.outputs.labels }}
        # gtfs-validator-metrics-service's base image (ghcr.io/mobilitydata/gtfs-validator) does not provide linux/arm64 images.
        # see also https://github.com/MobilityData/gtfs-validator/pull/1367
        platforms: linux/amd64
        # https://docs.docker.com/build/ci/github-actions/cache/#cache-backend-api
        cache-from: type=gha
        cache-to: type=gha,mode=max

name: build & publish Docker image

on:
  push:
    branches:
      - main

jobs:
  lint-test:
    name: lint & test
    uses: './.github/workflows/lint-test.yml'

  build-publish:
    name: build & publish Docker image
    needs:
      - lint-test
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v6

    - name: set up QEMU for cross-platform Docker builds
      uses: docker/setup-qemu-action@v4
    - name: set up Docker buildx
      uses: docker/setup-buildx-action@v4
    - name: install tools
      run: |
        sudo apt install -y jq

    - name: log into the GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: compute OCI version
      id: docker-meta
      run: |
        set -x
        oci_version="$(jq -rc .version package.json)"
        echo "oci-version=$oci_version" >>$GITHUB_OUTPUT
    - name: compute Docker image OCI metadata
      id: docker-metadata
      uses: docker/metadata-action@v6
      with:
        labels: |
          org.opencontainers.image.version=${{ steps.docker-meta.outputs.oci-version }}

    - name: build and push Docker image
      uses: docker/build-push-action@v6
      with:
        push: true
        tags: |
          ghcr.io/${{ github.repository }}:latest
        labels: ${{ steps.docker-metadata.outputs.labels }}
        # gtfs-validator-metrics-service's base image (ghcr.io/mobilitydata/gtfs-validator) does not provide linux/arm64 images.
        # see also https://github.com/MobilityData/gtfs-validator/pull/1367
        platforms: linux/amd64
        # https://docs.docker.com/build/ci/github-actions/cache/#cache-backend-api
        cache-from: type=gha
        cache-to: type=gha,mode=max
